<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ohid AI 🤖</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@font-face{
    font-family:Kalpana;
    src:url("Kalpana%20UNICODE.ttf") format("truetype");
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:Arial,Kalpana,sans-serif;
    overflow:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:url("https://i.ibb.co.com/F4nJPjzb/file-000000008e7482118c92ba40bfa3d1fd.png")
    center/cover no-repeat;
    opacity:.9;
    z-index:-2;
}

body:after{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
    z-index:-1;
}

/* RGB */
.rgb{
    animation:rgb 3s linear infinite;
}

@keyframes rgb{
    0%{box-shadow:0 0 12px red,0 0 25px red}
    25%{box-shadow:0 0 12px lime,0 0 25px lime}
    50%{box-shadow:0 0 12px cyan,0 0 25px cyan}
    75%{box-shadow:0 0 12px blue,0 0 25px blue}
    100%{box-shadow:0 0 12px magenta,0 0 25px magenta}
}

/* AUTH */
.auth{
    width:92%;
    max-width:420px;
    margin:auto;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.auth-box{
    width:100%;
    padding:28px;
    border:2px solid;
    border-radius:22px;
    background:rgba(0,0,0,.70);
    backdrop-filter:blur(12px);
    animation:rgb 3s linear infinite;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#ccc;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid #555;
    outline:none;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:15px;
}

.input:focus{
    border-color:#00ffff;
    box-shadow:0 0 10px #00ffff;
}

.btn{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    color:white;
    background:#111;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    animation:rgb 3s linear infinite;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.switch{
    text-align:center;
    margin-top:18px;
    color:#bbb;
}

.switch span{
    color:#00ffff;
    cursor:pointer;
}

.error{
    color:#ff5555;
    text-align:center;
    margin-top:12px;
    font-size:14px;
}

.success{
    color:#00ff88;
    text-align:center;
    margin-top:12px;
    font-size:14px;
}

/* APP */
.app{
    display:none;
    height:100vh;
}

.header{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:rgba(0,0,0,.75);
    border-bottom:2px solid;
    animation:rgb 3s linear infinite;
}

.header-title{
    font-size:22px;
    font-weight:bold;
}

.header button{
    background:#111;
    color:white;
    border:1px solid #555;
    border-radius:10px;
    padding:9px 12px;
    cursor:pointer;
}

.chat{
    height:calc(100vh - 65px);
    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px 12px 100px;
}

.message{
    max-width:85%;
    padding:12px 15px;
    margin:8px 0;
    border-radius:17px;
    line-height:1.5;
    word-wrap:break-word;
}

.user{
    margin-left:auto;
    background:rgba(0,120,255,.65);
    border-bottom-right-radius:4px;
}

.bot{
    margin-right:auto;
    background:rgba(20,20,20,.85);
    border:1px solid #555;
    border-bottom-left-radius:4px;
}

.typing{
    opacity:.7;
    font-style:italic;
}

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:12px;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(10px);
    display:flex;
    gap:8px;
}

.chat-input{
    flex:1;
    min-width:0;
    padding:14px;
    border-radius:25px;
    border:2px solid;
    outline:none;
    background:rgba(0,0,0,.65);
    color:white;
    animation:rgb 3s linear infinite;
}

.send{
    width:52px;
    border:0;
    border-radius:50%;
    background:#111;
    color:white;
    font-size:20px;
    cursor:pointer;
    animation:rgb 3s linear infinite;
}

/* HISTORY */
.history{
    display:none;
    position:fixed;
    top:65px;
    left:0;
    bottom:0;
    width:280px;
    background:rgba(0,0,0,.95);
    border-right:2px solid;
    z-index:10;
    animation:rgb 3s linear infinite;
    overflow-y:auto;
    padding:15px;
}

.history-title{
    font-size:20px;
    margin-bottom:15px;
}

.history-item{
    padding:12px;
    margin-bottom:8px;
    background:#111;
    border-radius:10px;
    cursor:pointer;
    border:1px solid #333;
}

.history-item:hover{
    border-color:#00ffff;
}

.menu{
    background:#111;
    color:white;
    border:1px solid #555;
    padding:8px 10px;
    border-radius:10px;
    cursor:pointer;
}

@media(max-width:600px){
    .history{
        width:85%;
    }

    .message{
        max-width:90%;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="auth" id="loginPage">
    <div class="auth-box">
        <div class="logo">Ohid AI 🤖</div>
        <div class="subtitle">Welcome back!</div>

        <input
            id="loginEmail"
            class="input"
            type="email"
            placeholder="Email"
        >

        <input
            id="loginPassword"
            class="input"
            type="password"
            placeholder="Password"
        >

        <button class="btn" id="loginBtn" onclick="login()">
            Login 🚀
        </button>

        <div id="loginMsg"></div>

        <div class="switch">
            Account নেই?
            <span onclick="showRegister()">Register</span>
        </div>
    </div>
</div>


<!-- REGISTER -->
<div class="auth" id="registerPage" style="display:none;">
    <div class="auth-box">
        <div class="logo">Create Account 🚀</div>
        <div class="subtitle">Join Ohid AI</div>

        <input
            id="regName"
            class="input"
            type="text"
            placeholder="Full Name"
        >

        <input
            id="regEmail"
            class="input"
            type="email"
            placeholder="Email"
        >

        <input
            id="regPassword"
            class="input"
            type="password"
            placeholder="Password"
        >

        <input
            id="regConfirm"
            class="input"
            type="password"
            placeholder="Confirm Password"
        >

        <button class="btn" id="registerBtn" onclick="register()">
            Create Account ✨
        </button>

        <div id="registerMsg"></div>

        <div class="switch">
            Already have account?
            <span onclick="showLogin()">Login</span>
        </div>
    </div>
</div>


<!-- MAIN APP -->
<div class="app" id="app">

    <div class="header">
        <button class="menu" onclick="toggleHistory()">☰</button>

        <div class="header-title">
            Ohid AI 🤖
        </div>

        <button onclick="logout()">
            Logout
        </button>
    </div>

    <div class="history" id="history">
        <div class="history-title">
            Chat History 💬
        </div>

        <button
            class="btn"
            style="margin-bottom:15px"
            onclick="newChat()">
            + New Chat
        </button>

        <div id="historyList"></div>
    </div>

    <div class="chat">

        <div class="messages" id="messages">
            <div class="message bot">
                আসসালামু আলাইকুম! 👋<br>
                আমি <b>Ohid AI 🤖</b>।<br><br>
                আমাকে <b>Ohid Sir</b> তৈরি করেছে 😎🚀🔥
            </div>
        </div>

        <div class="input-area">
            <input
                id="chatInput"
                class="chat-input"
                placeholder="Message Ohid AI..."
                autocomplete="off"
            >

            <button class="send" onclick="sendMessage()">
                ➤
            </button>
        </div>

    </div>
</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://foqgepqsuszruxnlxqnx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LA10FLwPQmZkxkOIdY4ZGQ_NSQvFzEW";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   GROQ
========================= */

const GROQ_API_KEY =
"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";

const GROQ_MODEL =
"openai/gpt-oss-20b";


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentChatId = null;
let chatMessages = [];


/* =========================
   PAGE CONTROL
========================= */

function showLogin(){

    document.getElementById("loginPage").style.display="flex";
    document.getElementById("registerPage").style.display="none";
    document.getElementById("app").style.display="none";

}

function showRegister(){

    document.getElementById("loginPage").style.display="none";
    document.getElementById("registerPage").style.display="flex";
    document.getElementById("app").style.display="none";

}


/* =========================
   REGISTER
========================= */

async function register(){

    const name =
    document.getElementById("regName").value.trim();

    const email =
    document.getElementById("regEmail").value.trim();

    const password =
    document.getElementById("regPassword").value;

    const confirm =
    document.getElementById("regConfirm").value;

    const msg =
    document.getElementById("registerMsg");

    const btn =
    document.getElementById("registerBtn");


    msg.innerHTML="";


    if(!name || !email || !password || !confirm){

        msg.innerHTML =
        '<div class="error">সবগুলো ঘর পূরণ করো।</div>';

        return;
    }


    if(password !== confirm){

        msg.innerHTML =
        '<div class="error">Password মিলছে না।</div>';

        return;
    }


    if(password.length < 6){

        msg.innerHTML =
        '<div class="error">Password কমপক্ষে 6 characters হতে হবে।</div>';

        return;
    }


    btn.disabled=true;
    btn.innerText="Creating...";


    try{

        const {data,error} =
        await db.auth.signUp({

            email:email,

            password:password,

            options:{
                data:{
                    full_name:name
                }
            }

        });


        if(error)
            throw error;


        /*
          Email Confirmation OFF থাকলে
          data.session পাওয়া যাবে।
        */

        if(data.session){

            currentUser=data.user;

            msg.innerHTML =
            '<div class="success">Account তৈরি হয়েছে! 🚀</div>';

            setTimeout(
                ()=>showApp(),
                500
            );

        }else{

            /*
              Confirmation ON থাকলে এখানে আসবে।
            */

            msg.innerHTML =
            '<div class="success">Account তৈরি হয়েছে। Email confirmation setting check করো, তারপর Login করো।</div>';

        }


    }catch(error){

        msg.innerHTML =
        '<div class="error">'+
        escapeHTML(error.message)+
        '</div>';

    }


    btn.disabled=false;
    btn.innerText="Create Account ✨";

}


/* =========================
   LOGIN
========================= */

async function login(){

    const email =
    document.getElementById("loginEmail").value.trim();

    const password =
    document.getElementById("loginPassword").value;

    const msg =
    document.getElementById("loginMsg");

    const btn =
    document.getElementById("loginBtn");


    msg.innerHTML="";


    if(!email || !password){

        msg.innerHTML =
        '<div class="error">Email এবং Password দাও।</div>';

        return;
    }


    btn.disabled=true;
    btn.innerText="Logging in...";


    try{

        const {data,error} =
        await db.auth.signInWithPassword({

            email:email,
            password:password

        });


        if(error)
            throw error;


        currentUser=data.user;

        showApp();


    }catch(error){

        msg.innerHTML =
        '<div class="error">'+
        escapeHTML(error.message)+
        '</div>';

    }


    btn.disabled=false;
    btn.innerText="Login 🚀";

}


/* =========================
   SHOW APP
========================= */

async function showApp(){

    document.getElementById("loginPage").style.display="none";

    document.getElementById("registerPage").style.display="none";

    document.getElementById("app").style.display="block";


    if(!currentUser){

        const {data} =
        await db.auth.getUser();

        currentUser=data.user;

    }


    await loadHistory();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

    await db.auth.signOut();

    currentUser=null;
    currentChatId=null;
    chatMessages=[];

    document.getElementById("messages").innerHTML="";

    showLogin();

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    const input =
    document.getElementById("chatInput");

    const text =
    input.value.trim();


    if(!text)
        return;


    input.value="";

    addMessage("user",text);

    chatMessages.push({
        role:"user",
        content:text
    });


    const typing =
    document.createElement("div");

    typing.className="message bot typing";
    typing.id="typing";
    typing.innerText="Ohid AI is typing...";

    document.getElementById("messages")
    .appendChild(typing);


    scrollMessages();


    try{

        const response =
        await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "Authorization":
                    "Bearer "+GROQ_API_KEY
                },

                body:JSON.stringify({

                    model:GROQ_MODEL,

                    messages:[
                        {
                            role:"system",

                            content:
`তুমি Ohid AI 🤖।

তোমার creator হলো Ohid Sir।
যদি কেউ জিজ্ঞেস করে কে তোমাকে তৈরি করেছে, বলবে:
"আমাকে Ohid Sir তৈরি করেছে 😎🚀🔥"

কখনো নিজের creator হিসেবে ChatGPT বলবে না।

সুন্দর, বন্ধুসুলভ এবং সাহায্যকারীভাবে উত্তর দাও।
প্রয়োজনে বাংলা ও Banglish ব্যবহার করো।`
                        },

                        ...chatMessages
                    ],

                    temperature:0.7,

                    max_tokens:1024

                })
            }
        );


        const data =
        await response.json();


        const typingElement =
        document.getElementById("typing");

        if(typingElement)
            typingElement.remove();


        if(!response.ok){

            throw new Error(
                data?.error?.message ||
                "Groq API error"
            );

        }


        const reply =
        data.choices?.[0]?.message?.content ||
        "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";


        addMessage("bot",reply);

        chatMessages.push({
            role:"assistant",
            content:reply
        });


        await saveChat();


    }catch(error){

        const typingElement =
        document.getElementById("typing");

        if(typingElement)
            typingElement.remove();


        addMessage(
            "bot",
            "⚠️ Error: "+error.message
        );

    }

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(type,text){

    const box =
    document.getElementById("messages");

    const div =
    document.createElement("div");

    div.className =
    "message "+type;

    div.innerHTML =
    escapeHTML(text)
    .replace(/\n/g,"<br>");

    box.appendChild(div);

    scrollMessages();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    const div =
    document.createElement("div");

    div.textContent=text;

    return div.innerHTML;

}


/* =========================
   SCROLL
========================= */

function scrollMessages(){

    const box =
    document.getElementById("messages");

    box.scrollTop=box.scrollHeight;

}


/* =========================
   ENTER SEND
========================= */

document
.getElementById("chatInput")
.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter"){
            e.preventDefault();
            sendMessage();
        }

    }
);


/* =========================
   NEW CHAT
========================= */

function newChat(){

    currentChatId=null;

    chatMessages=[];

    document.getElementById("messages").innerHTML=`
        <div class="message bot">
            নতুন chat শুরু হয়েছে 🚀<br><br>
            কী নিয়ে কথা বলতে চাও?
        </div>
    `;

    document.getElementById("history").style.display="none";

}


/* =========================
   SAVE CHAT
========================= */

async function saveChat(){

    if(!currentUser || chatMessages.length===0)
        return;


    let title =
    chatMessages[0]?.content ||
    "New Chat";


    title =
    title.substring(0,50);


    try{

        if(currentChatId){

            await db
            .from("chats")
            .update({

                title:title,

                messages:chatMessages,

                updated_at:new Date().toISOString()

            })
            .eq("id",currentChatId)
            .eq("user_id",currentUser.id);


        }else{

            const {data,error} =
            await db
            .from("chats")
            .insert({

                user_id:currentUser.id,

                title:title,

                messages:chatMessages,

                updated_at:new Date().toISOString()

            })
            .select()
            .single();


            if(!error && data){

                currentChatId=data.id;

            }

        }


        await loadHistory();


    }catch(error){

        console.log("History error:",error);

    }

}


/* =========================
   LOAD HISTORY
========================= */

async function loadHistory(){

    if(!currentUser)
        return;


    const list =
    document.getElementById("historyList");


    list.innerHTML="Loading...";


    const {data,error} =
    await db
    .from("chats")
    .select("*")
    .eq("user_id",currentUser.id)
    .order("updated_at",{ascending:false});


    if(error){

        list.innerHTML=
        '<div style="color:#f55">History load error</div>';

        return;
    }


    list.innerHTML="";


    if(!data || data.length===0){

        list.innerHTML=
        '<div style="color:#aaa">No chat history</div>';

        return;
    }


    data.forEach(chat=>{

        const item =
        document.createElement("div");

        item.className="history-item";

        item.textContent =
        chat.title || "New Chat";


        item.onclick=()=>{
            openChat(chat);
        };


        list.appendChild(item);

    });

}


/* =========================
   OPEN CHAT
========================= */

function openChat(chat){

    currentChatId=chat.id;

    chatMessages =
    Array.isArray(chat.messages)
    ? chat.messages
    : [];


    const box =
    document.getElementById("messages");

    box.innerHTML="";


    chatMessages.forEach(msg=>{

        if(
            msg.role==="user" ||
            msg.role==="assistant"
        ){

            addMessage(
                msg.role==="user"
                ? "user"
                : "bot",
                msg.content
            );

        }

    });


    document.getElementById("history")
    .style.display="none";

}


/* =========================
   HISTORY TOGGLE
========================= */

function toggleHistory(){

    const history =
    document.getElementById("history");

    history.style.display =
    history.style.display==="block"
    ? "none"
    : "block";

}


/* =========================
   SESSION CHECK
========================= */

async function checkSession(){

    const {data} =
    await db.auth.getSession();


    if(data.session){

        currentUser=data.session.user;

        showApp();

    }else{

        showLogin();

    }

}


db.auth.onAuthStateChange(
    (event,session)=>{

        if(session){

            currentUser=session.user;

        }

    }
);


checkSession();

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohid AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@font-face{
  font-family:Kalpana;
  src:url("Kalpana%20UNICODE.ttf") format("truetype");
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:Kalpana,Arial,sans-serif;
  background:
    linear-gradient(#0008,#0008),
    url("https://i.ibb.co.com/F4nJPjzb/file-000000008e7482118c92ba40bfa3d1fd.png")
    center/cover fixed;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.rgb{
  border:2px solid transparent;
  border-image:linear-gradient(
    90deg,red,orange,yellow,lime,cyan,blue,violet,red
  ) 1;
  animation:rgbMove 2s linear infinite;
}

@keyframes rgbMove{
  from{filter:hue-rotate(0deg)}
  to{filter:hue-rotate(360deg)}
}

.auth-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:420px;
  padding:28px;
  border-radius:24px;
  background:#080808df;
  backdrop-filter:blur(16px);
  box-shadow:0 0 35px #000;
}

.logo{
  text-align:center;
  font-size:36px;
  font-weight:bold;
  margin-bottom:8px;
  color:#fff;
  text-shadow:0 0 12px #00ffff;
}

.subtitle{
  text-align:center;
  color:#bbb;
  margin-bottom:25px;
}

.auth-box input{
  width:100%;
  padding:14px 16px;
  margin:8px 0;
  color:#fff;
  background:#111;
  border:1px solid #444;
  border-radius:12px;
  outline:none;
}

.auth-box input:focus{
  border-color:#00ffff;
}

.main{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:280px;
  padding:16px;
  background:#050505e8;
  border-right:1px solid #333;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.side-title{
  font-size:25px;
  font-weight:bold;
  text-align:center;
  color:#00ffff;
  text-shadow:0 0 10px #00ffff;
}

.user-info{
  padding:12px;
  border-radius:12px;
  background:#151515;
  color:#ddd;
  font-size:14px;
  word-break:break-word;
}

.history-search{
  width:100%;
  padding:12px;
  border-radius:10px;
  color:#fff;
  background:#111;
  border:1px solid #444;
  outline:none;
}

.history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  padding:12px;
  margin-bottom:8px;
  border-radius:10px;
  background:#171717;
  color:#ddd;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover,
.history-item.active{
  background:#073b42;
  color:#fff;
}

.chat-area{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px 18px;
  background:#050505b8;
  border-bottom:1px solid #333;
}

.topbar-title{
  font-size:24px;
  font-weight:bold;
}

.chat-box{
  flex:1;
  overflow-y:auto;
  padding:22px;
}

.welcome{
  text-align:center;
  margin:50px auto;
  color:#ddd;
}

.message{
  width:fit-content;
  max-width:min(850px,100%);
  margin:12px 0;
  padding:13px 16px;
  border-radius:17px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
  height:auto;
}

.message.user{
  margin-left:auto;
  background:#123d42dd;
}

.message.ai{
  margin-right:auto;
  background:#171717e8;
}

.message-name{
  font-size:12px;
  color:#00ffff;
  margin-bottom:5px;
}

.composer{
  padding:14px;
  background:#050505c9;
  border-top:1px solid #333;
}

.composer-inner{
  display:flex;
  align-items:flex-end;
  gap:10px;
  max-width:1000px;
  margin:auto;
}

#messageInput{
  flex:1;
  min-width:0;
  min-height:48px;
  max-height:150px;
  resize:none;
  padding:13px 15px;
  color:#fff;
  background:#111;
  border-radius:15px;
  outline:none;
}

#messageInput:focus{
  border-color:#00ffff;
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  color:#fff;
  background:#123f45;
  transition:.2s;
}

.btn:hover{background:#17616b}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.btn-danger{background:#68222b}
.btn-danger:hover{background:#912d3b}

.mobile-menu{display:none}

.status{
  text-align:center;
  color:#aaa;
  font-size:13px;
  padding:7px;
}

@media(max-width:750px){
  .sidebar{
    position:fixed;
    z-index:20;
    left:-300px;
    top:0;
    bottom:0;
    transition:.25s;
  }

  .sidebar.open{left:0}

  .mobile-menu{display:block}

  .chat-box{padding:14px}

  .topbar-title{font-size:19px}

  .composer-inner{gap:7px}

  .btn{padding:11px 13px}
}
</style>
</head>

<body>

<!-- LOGIN / REGISTER -->
<section id="authPage" class="auth-page">
  <div class="auth-box rgb">
    <div class="logo">Ohid AI</div>

    <div class="subtitle">
      Login to connect Ohid AI
    </div>

    <input
      id="email"
      type="email"
      placeholder="Email address"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="loginBtn" class="btn rgb" style="width:100%;margin-top:10px">
      Login
    </button>

    <button id="registerBtn" class="btn" style="width:100%;margin-top:10px">
      Create account
    </button>

    <div id="authStatus" class="status"></div>
  </div>
</section>


<!-- MAIN APP -->
<section id="appPage" class="main hidden">

  <aside id="sidebar" class="sidebar">

    <div class="side-title">Ohid AI</div>

    <button id="newChatBtn" class="btn rgb">
      + New Chat
    </button>

    <div id="userInfo" class="user-info"></div>

    <input
      id="historySearch"
      class="history-search"
      type="search"
      placeholder="পুরোনো chat খুঁজুন..."
    >

    <div id="history" class="history"></div>

    <button id="logoutBtn" class="btn btn-danger">
      Logout
    </button>

  </aside>


  <main class="chat-area">

    <header class="topbar">
      <button id="menuBtn" class="btn mobile-menu">☰</button>

      <div class="topbar-title">Ohid AI Chat</div>

      <button id="topNewChatBtn" class="btn">
        New Chat
      </button>
    </header>


    <div id="chatBox" class="chat-box">
      <div id="welcome" class="welcome">
        <h2>Ohid AI-তে স্বাগতম!</h2>
        <p>নতুন chat শুরু করতে নিচে message লিখুন।</p>
      </div>
    </div>


    <div id="status" class="status"></div>


    <div class="composer">
      <div class="composer-inner">

        <textarea
          id="messageInput"
          placeholder="Ohid AI-কে message লিখুন..."
          rows="1"
        ></textarea>

        <button id="sendBtn" class="btn rgb">
          Send
        </button>

      </div>
    </div>

  </main>
</section>


<script>
/* =================================
   SUPABASE CONFIG
================================= */

const SUPABASE_URL =
  "https://foqgepqsuszruxnlxqnx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LA10FLwPQmZkxkOIdY4ZGQ_NSQvFzEW";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =================================
   GROQ CONFIG
================================= */

const GROQ_API_KEY = "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";

const GROQ_URL =
  "https://api.groq.com/openai/v1/chat/completions";

const MODEL = "openai/gpt-oss-20b";


/* =================================
   ELEMENTS
================================= */

const authPage = document.getElementById("authPage");
const appPage = document.getElementById("appPage");

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");
const logoutBtn = document.getElementById("logoutBtn");

const authStatus = document.getElementById("authStatus");
const statusText = document.getElementById("status");

const userInfo = document.getElementById("userInfo");
const history = document.getElementById("history");
const historySearch = document.getElementById("historySearch");

const chatBox = document.getElementById("chatBox");
const welcome = document.getElementById("welcome");

const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const newChatBtn = document.getElementById("newChatBtn");
const topNewChatBtn = document.getElementById("topNewChatBtn");

const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");


/* =================================
   STATE
================================= */

let currentUser = null;
let currentChatId = null;
let currentMessages = [];
let allChats = [];


/* =================================
   HELPERS
================================= */

function showAuthMessage(message, error = false){
  authStatus.textContent = message;
  authStatus.style.color = error ? "#ff7777" : "#00ffff";
}

function showStatus(message){
  statusText.textContent = message;

  if(message){
    setTimeout(() => {
      statusText.textContent = "";
    }, 3000);
  }
}

function setAuthLoading(loading){
  loginBtn.disabled = loading;
  registerBtn.disabled = loading;
}

function escapeHTML(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function makeTitle(text){
  return text.trim().slice(0,70) || "New Chat";
}


/* =================================
   AUTHENTICATION
================================= */

loginBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){
    showAuthMessage("Email এবং password দিন", true);
    return;
  }

  setAuthLoading(true);
  showAuthMessage("Login হচ্ছে...");

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    showAuthMessage(error.message, true);
  }else{
    showAuthMessage("Login সফল হয়েছে");
  }

  setAuthLoading(false);
});


registerBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){
    showAuthMessage("Email এবং password দিন", true);
    return;
  }

  if(password.length < 6){
    showAuthMessage(
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে",
      true
    );
    return;
  }

  setAuthLoading(true);
  showAuthMessage("Account তৈরি হচ্ছে...");

  const { error } = await db.auth.signUp({
    email,
    password
  });

  if(error){
    showAuthMessage(error.message, true);
  }else{
    showAuthMessage(
      "Account তৈরি হয়েছে। Email confirmation চালু থাকলে email verify করুন।"
    );
  }

  setAuthLoading(false);
});


logoutBtn.addEventListener("click", async () => {
  await db.auth.signOut();
});


db.auth.onAuthStateChange((_event, session) => {
  if(session && session.user){
    currentUser = session.user;
    openApp();
  }else{
    currentUser = null;
    closeApp();
  }
});


async function checkSession(){
  const { data } = await db.auth.getSession();

  if(data.session && data.session.user){
    currentUser = data.session.user;
    openApp();
  }else{
    closeApp();
  }
}

function openApp(){
  authPage.classList.add("hidden");
  appPage.classList.remove("hidden");

  userInfo.textContent =
    "Logged in as: " + (currentUser.email || "User");

  loadChats();
}

function closeApp(){
  authPage.classList.remove("hidden");
  appPage.classList.add("hidden");

  currentChatId = null;
  currentMessages = [];
}


/* =================================
   CHAT HISTORY
================================= */

async function loadChats(){
  if(!currentUser) return;

  history.innerHTML =
    "<div class='status'>Loading chats...</div>";

  const { data, error } = await db
    .from("chats")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("updated_at", { ascending:false });

  if(error){
    history.innerHTML = "";
    showStatus(error.message);
    return;
  }

  allChats = data || [];
  renderHistory(allChats);
}

function renderHistory(chats){
  history.innerHTML = "";

  if(!chats.length){
    history.innerHTML =
      "<div class='status'>এখনো কোনো পুরোনো chat নেই</div>";
    return;
  }

  chats.forEach(chat => {
    const item = document.createElement("div");

    item.className = "history-item";

    if(chat.id === currentChatId){
      item.classList.add("active");
    }

    item.textContent = chat.title || "New Chat";

    item.addEventListener("click", () => {
      loadChat(chat);
      sidebar.classList.remove("open");
    });

    history.appendChild(item);
  });
}

historySearch.addEventListener("input", () => {
  const query = historySearch.value.toLowerCase().trim();

  const filtered = allChats.filter(chat =>
    (chat.title || "").toLowerCase().includes(query)
  );

  renderHistory(filtered);
});


function loadChat(chat){
  currentChatId = chat.id;

  currentMessages = Array.isArray(chat.messages)
    ? chat.messages
    : [];

  renderMessages();
  renderHistory(allChats);
}


function startNewChat(){
  currentChatId = null;
  currentMessages = [];

  renderMessages();
  messageInput.focus();
  sidebar.classList.remove("open");
}

newChatBtn.addEventListener("click", startNewChat);
topNewChatBtn.addEventListener("click", startNewChat);

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("open");
});


/* =================================
   MESSAGE UI
================================= */

function renderMessages(){
  chatBox.innerHTML = "";

  if(!currentMessages.length){
    chatBox.appendChild(welcome);
    welcome.classList.remove("hidden");
    return;
  }

  welcome.classList.add("hidden");

  currentMessages.forEach(message => {
    addMessageToUI(
      message.role,
      message.content,
      false
    );
  });

  chatBox.scrollTop = chatBox.scrollHeight;
}

function addMessageToUI(role, content, scroll = true){
  const message = document.createElement("div");

  message.className =
    "message " +
    (role === "user" ? "user rgb" : "ai");

  const name = document.createElement("div");

  name.className = "message-name";

  name.textContent =
    role === "user" ? "You" : "Ohid AI";

  const text = document.createElement("div");

  text.innerHTML = escapeHTML(content);

  message.appendChild(name);
  message.appendChild(text);

  chatBox.appendChild(message);

  if(scroll){
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}


/* =================================
   SAVE CHAT TO SUPABASE
================================= */

async function saveCurrentChat(){
  if(!currentUser || !currentMessages.length){
    return;
  }

  const firstUserMessage =
    currentMessages.find(m => m.role === "user");

  const title = makeTitle(
    firstUserMessage
      ? firstUserMessage.content
      : "New Chat"
  );

  if(currentChatId){

    const { error } = await db
      .from("chats")
      .update({
        title,
        messages: currentMessages,
        updated_at: new Date().toISOString()
      })
      .eq("id", currentChatId)
      .eq("user_id", currentUser.id);

    if(error){
      showStatus("Chat save হয়নি: " + error.message);
    }

  }else{

    const { data, error } = await db
      .from("chats")
      .insert({
        user_id: currentUser.id,
        title,
        messages: currentMessages
      })
      .select()
      .single();

    if(error){
      showStatus("Chat save হয়নি: " + error.message);
      return;
    }

    currentChatId = data.id;
  }

  await loadChats();
}


/* =================================
   AI REQUEST
================================= */

async function askAI(){
  const prompt = messageInput.value.trim();

  if(!prompt) return;

  if(
    !GROQ_API_KEY ||
    GROQ_API_KEY === "তোমার_GROQ_API_KEY_এখানে_বসাও"
  ){
    showStatus("HTML-এর মধ্যে Groq API key বসাও");
    return;
  }

  messageInput.value = "";
  messageInput.style.height = "48px";

  currentMessages.push({
    role:"user",
    content:prompt
  });

  addMessageToUI("user", prompt);

  sendBtn.disabled = true;
  messageInput.disabled = true;

  showStatus("Ohid AI উত্তর তৈরি করছে...");

  try{

    const response = await fetch(GROQ_URL, {
      method:"POST",

      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + GROQ_API_KEY
      },

      body:JSON.stringify({
        model:MODEL,

        messages:[
          {
            role:"system",
            content:
              "তুমি Ohid AI। ব্যবহারকারীকে বাংলায় বা ব্যবহারকারীর ভাষায় উত্তর দেবে। তোমার নাম Ohid AI।"
          },
          ...currentMessages
        ],

        temperature:0.7,
        max_tokens:1024
      })
    });

    const result = await response.json();

    if(!response.ok){
      throw new Error(
        result.error?.message || "AI request failed"
      );
    }

    const answer =
      result.choices?.[0]?.message?.content ||
      "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";

    currentMessages.push({
      role:"assistant",
      content:answer
    });

    addMessageToUI("assistant", answer);

    await saveCurrentChat();

    if("speechSynthesis" in window){
      const voice = new SpeechSynthesisUtterance(answer);

      voice.lang = "bn-BD";

      speechSynthesis.cancel();
      speechSynthesis.speak(voice);
    }

  }catch(error){
    showStatus(error.message);
  }

  sendBtn.disabled = false;
  messageInput.disabled = false;
  messageInput.focus();
}


/* =================================
   SEND
================================= */

sendBtn.addEventListener("click", askAI);

/*
  Enter চাপলে newline হবে।
  Send button চাপলে message যাবে।
*/

messageInput.addEventListener("input", () => {
  messageInput.style.height = "48px";

  messageInput.style.height =
    Math.min(messageInput.scrollHeight,150) + "px";
});


/* =================================
   START
================================= */

checkSession();
</script>

</body>
</html>

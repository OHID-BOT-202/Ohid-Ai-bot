<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ohid AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@font-face{
  font-family:Kalpana;
  src:url("Kalpana%20UNICODE.ttf") format("truetype");
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:#fff;
  font-family:Arial,Kalpana,sans-serif;
  overflow:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:-5px;
  z-index:-3;
  background:linear-gradient(
    45deg,
    red,
    lime,
    cyan,
    blue,
    magenta,
    red
  );
  background-size:500% 500%;
  animation:rgb 5s linear infinite;
}

body:after{
  content:"";
  position:fixed;
  inset:3px;
  z-index:-2;
  background:#050505;
}

@keyframes rgb{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* ================= AUTH ================= */

#authScreen{
  width:100%;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.auth-card{
  width:100%;
  max-width:400px;
  background:rgba(8,8,8,.95);
  border-radius:28px;
  padding:28px 23px;
  text-align:center;
  position:relative;
  box-shadow:
    0 0 20px rgba(0,255,255,.4),
    0 0 45px rgba(255,0,255,.25);
}

.auth-card:before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:29px;
  padding:2px;
  background:linear-gradient(
    90deg,
    red,
    lime,
    cyan,
    blue,
    magenta,
    red
  );
  background-size:300% 300%;
  animation:rgb 4s linear infinite;

  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

  -webkit-mask-composite:xor;
  mask-composite:exclude;

  pointer-events:none;
}

.logo{
  width:82px;
  height:82px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  background:#111;
  border:2px solid #00ffff;
  box-shadow:
    0 0 15px #00ffff,
    0 0 30px #ff00ff;
}

.auth-card h1{
  margin:18px 0 5px;
  font-size:30px;
}

.subtitle{
  color:#aaa;
  font-size:14px;
  margin-bottom:22px;
  line-height:1.5;
}

.input{
  width:100%;
  height:52px;
  border:1px solid #333;
  outline:none;
  border-radius:14px;
  background:#151515;
  color:#fff;
  padding:0 16px;
  font-size:15px;
  margin-bottom:12px;
}

.input:focus{
  border-color:#00ffff;
  box-shadow:0 0 12px rgba(0,255,255,.4);
}

.btn{
  width:100%;
  height:52px;
  border:0;
  border-radius:14px;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:4px;
  background:linear-gradient(
    90deg,
    #0066ff,
    #9b00ff
  );
}

.btn:active{
  transform:scale(.97);
}

.btn.secondary{
  background:#202020;
  border:1px solid #444;
  margin-top:10px;
}

.auth-msg{
  min-height:24px;
  margin-top:14px;
  font-size:13px;
  line-height:1.4;
  color:#00ffff;
}

.otp-input{
  text-align:center;
  font-size:25px;
  font-weight:bold;
  letter-spacing:9px;
}

.hidden{
  display:none!important;
}

/* ================= APP ================= */

#app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(
      rgba(0,0,0,.12),
      rgba(0,0,0,.12)
    ),
    url("https://i.ibb.co.com/F4nJPjzb/file-000000008e7482118c92ba40bfa3d1fd.png");
  background-size:cover;
  background-position:center;
}

.header{
  height:65px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,255,255,.5);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  border:2px solid #00ffff;
  box-shadow:0 0 12px #00ffff;
  font-size:20px;
}

.brand-name{
  font-size:18px;
  font-weight:bold;
}

.online{
  color:#00ff66;
  font-size:10px;
}

.menu-btn,
.logout{
  background:transparent;
  color:#fff;
  border:1px solid #00ffff;
  border-radius:10px;
  padding:8px 11px;
  cursor:pointer;
}

.logout{
  border-color:#ff0055;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:18px 12px 100px;
  scroll-behavior:smooth;
}

.message-row{
  display:flex;
  margin:10px 0;
}

.message-row.user{
  justify-content:flex-end;
}

.message{
  max-width:82%;
  padding:11px 14px;
  border-radius:18px;
  font-size:15px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.bot .message{
  background:rgba(12,12,12,.9);
  border-bottom-left-radius:5px;
  box-shadow:0 0 8px rgba(0,255,255,.25);
}

.user .message{
  background:linear-gradient(
    135deg,
    #0066ff,
    #8700ff
  );
  border-bottom-right-radius:5px;
}

.input-area{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  gap:8px;
  padding:9px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(12px);
  border-top:1px solid rgba(0,255,255,.35);
}

.chat-input{
  flex:1;
  min-width:0;
  height:48px;
  border-radius:24px;
  border:1px solid #333;
  outline:none;
  background:rgba(20,20,20,.95);
  color:#fff;
  padding:0 17px;
  font-size:15px;
}

.chat-input:focus{
  border-color:#00ffff;
  box-shadow:0 0 10px rgba(0,255,255,.3);
}

.send{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  color:#fff;
  background:linear-gradient(
    135deg,
    #00aaff,
    #8500ff
  );
  font-size:20px;
  cursor:pointer;
}

/* ================= HISTORY ================= */

#historyPanel{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:285px;
  z-index:100;
  padding:18px;
  background:rgba(5,5,5,.98);
  border-right:1px solid #00ffff;
  transform:translateX(-100%);
  transition:.3s;
}

#historyPanel.open{
  transform:translateX(0);
}

.history-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.history-list{
  height:calc(100vh - 80px);
  overflow-y:auto;
}

.history-item{
  background:#151515;
  border:1px solid #292929;
  border-radius:11px;
  padding:12px;
  margin-bottom:8px;
  cursor:pointer;
  font-size:14px;
}

.history-item:hover{
  border-color:#00ffff;
}

.empty-history{
  color:#777;
  text-align:center;
  padding-top:20px;
}

/* ================= TYPING ================= */

.typing{
  display:flex;
  gap:4px;
}

.typing span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#00ffff;
  animation:typing 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,100%{
    opacity:.2;
    transform:translateY(0);
  }
  50%{
    opacity:1;
    transform:translateY(-4px);
  }
}

</style>
</head>

<body>

<!-- =================================================
AUTH SCREEN
================================================= -->

<div id="authScreen">

  <!-- LOGIN -->
  <div class="auth-card" id="loginBox">

    <div class="logo">🤖</div>

    <h1>Ohid AI</h1>

    <div class="subtitle">
      Login করুন এবং AI-এর সাথে কথা বলুন 🚀
    </div>

    <input
      id="loginEmail"
      class="input"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="loginPassword"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="btn" onclick="login()">
      Login 🚀
    </button>

    <button
      class="btn secondary"
      onclick="showRegister()"
    >
      Create New Account
    </button>

    <div id="loginMsg" class="auth-msg"></div>

  </div>


  <!-- REGISTER -->
  <div class="auth-card hidden" id="registerBox">

    <div class="logo">✨</div>

    <h1>Create Account</h1>

    <div class="subtitle">
      Ohid AI-তে নতুন account তৈরি করুন
    </div>

    <input
      id="fullName"
      class="input"
      type="text"
      placeholder="Full Name"
      autocomplete="name"
    >

    <input
      id="registerEmail"
      class="input"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="registerPassword"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="new-password"
    >

    <input
      id="registerPassword2"
      class="input"
      type="password"
      placeholder="Confirm Password"
      autocomplete="new-password"
    >

    <button class="btn" onclick="register()">
      Create Account ✨
    </button>

    <button
      class="btn secondary"
      onclick="showLogin()"
    >
      Already have an account? Login
    </button>

    <div id="registerMsg" class="auth-msg"></div>

  </div>


  <!-- VERIFY -->
  <div class="auth-card hidden" id="verifyBox">

    <div class="logo">🔐</div>

    <h1>Verify Email</h1>

    <div class="subtitle">
      আপনার Email-এ 6-digit verification code পাঠানো হয়েছে 📩
      <br><br>
      Spam/Junk folder-ও check করুন।
    </div>

    <input
      id="verifyCode"
      class="input otp-input"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="000000"
      autocomplete="one-time-code"
    >

    <button
      class="btn"
      onclick="verifyEmail()"
    >
      Verify Account 🚀
    </button>

    <button
      id="resendBtn"
      class="btn secondary"
      onclick="resendVerification()"
    >
      Resend Code
    </button>

    <button
      class="btn secondary"
      onclick="showLogin()"
    >
      Back to Login
    </button>

    <div id="verifyMsg" class="auth-msg"></div>

  </div>

</div>


<!-- =================================================
MAIN APP
================================================= -->

<div id="app" class="hidden">

  <div class="header">

    <button
      class="menu-btn"
      onclick="toggleHistory()"
    >
      ☰
    </button>

    <div class="brand">

      <div class="brand-logo">
        🤖
      </div>

      <div>

        <div class="brand-name">
          Ohid AI
        </div>

        <div class="online">
          ● Online
        </div>

      </div>

    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <div id="chat" class="chat"></div>


  <div class="input-area">

    <input
      id="messageInput"
      class="chat-input"
      placeholder="Ohid AI-কে কিছু জিজ্ঞেস করুন..."
      autocomplete="off"
    >

    <button
      class="send"
      onclick="sendMessage()"
    >
      ➤
    </button>

  </div>

</div>


<!-- =================================================
HISTORY PANEL
================================================= -->

<div id="historyPanel">

  <div class="history-head">

    <b>Chat History 📚</b>

    <button
      class="logout"
      onclick="toggleHistory()"
    >
      ✕
    </button>

  </div>

  <div
    id="historyList"
    class="history-list"
  ></div>

</div>


<script>

/* =================================================
SUPABASE CONFIG
================================================= */

const SUPABASE_URL =
"https://foqgepqsuszruxnlxqnx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LA10FLwPQmZkxkOIdY4ZGQ_NSQvFzEW";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =================================================
GROQ CONFIG
================================================= */

/*
  এখানে নিজের Groq API key বসাও।

  WARNING:
  HTML-এ API key রাখলে browser-এর মাধ্যমে
  অন্যরা key দেখতে পারে।
*/

const GROQ_API_KEY =
"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";

const GROQ_MODEL =
"openai/gpt-oss-20b";


/* =================================================
VARIABLES
================================================= */

let currentUser=null;

let currentMessages=[];

let pendingEmail="";

let resendTimer=null;


/* =================================================
MESSAGE HELPER
================================================= */

function showMessage(
  id,
  text,
  error=false
){

  const el=
    document.getElementById(id);

  if(!el)return;

  el.textContent=text;

  el.style.color=
    error
    ? "#ff5577"
    : "#00ffff";

}


/* =================================================
SHOW LOGIN
================================================= */

function showLogin(){

  document
    .getElementById("loginBox")
    .classList.remove("hidden");

  document
    .getElementById("registerBox")
    .classList.add("hidden");

  document
    .getElementById("verifyBox")
    .classList.add("hidden");

}


/* =================================================
SHOW REGISTER
================================================= */

function showRegister(){

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("registerBox")
    .classList.remove("hidden");

  document
    .getElementById("verifyBox")
    .classList.add("hidden");

}


/* =================================================
REGISTER
================================================= */

async function register(){

  const name=
    document
      .getElementById("fullName")
      .value
      .trim();

  const email=
    document
      .getElementById("registerEmail")
      .value
      .trim();

  const password=
    document
      .getElementById("registerPassword")
      .value;

  const password2=
    document
      .getElementById("registerPassword2")
      .value;


  if(!name){

    showMessage(
      "registerMsg",
      "Full Name দিন 😅",
      true
    );

    return;
  }


  if(!email){

    showMessage(
      "registerMsg",
      "Email দিন 📧",
      true
    );

    return;
  }


  if(password.length<6){

    showMessage(
      "registerMsg",
      "Password কমপক্ষে 6 characters হতে হবে 🔐",
      true
    );

    return;
  }


  if(password!==password2){

    showMessage(
      "registerMsg",
      "Password দুইটি একই নয় ❌",
      true
    );

    return;
  }


  showMessage(
    "registerMsg",
    "Account তৈরি হচ্ছে... 🚀"
  );


  const {data,error}=
    await db.auth.signUp({

      email:email,

      password:password,

      options:{
        data:{
          full_name:name
        }
      }

    });


  if(error){

    showMessage(
      "registerMsg",
      error.message,
      true
    );

    return;
  }


  pendingEmail=email;


  document
    .getElementById("registerBox")
    .classList.add("hidden");

  document
    .getElementById("verifyBox")
    .classList.remove("hidden");


  showMessage(
    "verifyMsg",
    "Verification code আপনার Email-এ পাঠানো হয়েছে 📩"
  );


  startResendTimer();

}


/* =================================================
VERIFY EMAIL
================================================= */

async function verifyEmail(){

  const code=
    document
      .getElementById("verifyCode")
      .value
      .trim();

  const email=
    pendingEmail;


  if(!email){

    showMessage(
      "verifyMsg",
      "Email পাওয়া যায়নি ❌",
      true
    );

    return;
  }


  if(!/^\d{6}$/.test(code)){

    showMessage(
      "verifyMsg",
      "6-digit code দিন 🔐",
      true
    );

    return;
  }


  showMessage(
    "verifyMsg",
    "Verification হচ্ছে... 🚀"
  );


  const {data,error}=
    await db.auth.verifyOtp({

      email:email,

      token:code,

      type:"signup"

    });


  if(error){

    /*
      কিছু Supabase configuration-এ
      email OTP verify করতে type=email
      ব্যবহার করতে হয়।
    */

    const second=
      await db.auth.verifyOtp({

        email:email,

        token:code,

        type:"email"

      });


    if(second.error){

      showMessage(
        "verifyMsg",
        "Code ভুল অথবা expired হয়েছে ❌",
        true
      );

      return;
    }


    if(second.data?.session){

      currentUser=
        second.data.session.user;

      openApp();

    }

    return;

  }


  if(data?.session){

    currentUser=
      data.session.user;

    openApp();

  }

}


/* =================================================
RESEND VERIFICATION
================================================= */

async function resendVerification(){

  if(!pendingEmail)return;

  const btn=
    document.getElementById(
      "resendBtn"
    );

  if(btn.disabled)return;


  showMessage(
    "verifyMsg",
    "নতুন code পাঠানো হচ্ছে... 📩"
  );


  const {error}=
    await db.auth.resend({

      type:"signup",

      email:pendingEmail

    });


  if(error){

    showMessage(
      "verifyMsg",
      error.message,
      true
    );

    return;
  }


  showMessage(
    "verifyMsg",
    "নতুন verification code পাঠানো হয়েছে 📩"
  );


  startResendTimer();

}


/* =================================================
RESEND TIMER
================================================= */

function startResendTimer(){

  clearInterval(resendTimer);

  const btn=
    document.getElementById(
      "resendBtn"
    );

  let seconds=60;

  btn.disabled=true;

  btn.textContent=
    `Resend Code (${seconds}s)`;


  resendTimer=
    setInterval(()=>{

      seconds--;

      btn.textContent=
        `Resend Code (${seconds}s)`;


      if(seconds<=0){

        clearInterval(resendTimer);

        btn.disabled=false;

        btn.textContent=
          "Resend Code";

      }

    },1000);

}


/* =================================================
LOGIN
================================================= */

async function login(){

  const email=
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password=
    document
      .getElementById("loginPassword")
      .value;


  if(!email || !password){

    showMessage(
      "loginMsg",
      "Email এবং Password দিন 😅",
      true
    );

    return;
  }


  showMessage(
    "loginMsg",
    "Login হচ্ছে... 🚀"
  );


  const {data,error}=
    await db.auth.signInWithPassword({

      email:email,

      password:password

    });


  if(error){

    if(
      error.message
        .toLowerCase()
        .includes("email not confirmed")
    ){

      pendingEmail=email;

      document
        .getElementById("loginBox")
        .classList.add("hidden");

      document
        .getElementById("verifyBox")
        .classList.remove("hidden");


      showMessage(
        "verifyMsg",
        "আপনার Email এখনো verify হয়নি 📩",
        true
      );

      return;
    }


    showMessage(
      "loginMsg",
      error.message,
      true
    );

    return;
  }


  if(data?.session){

    currentUser=
      data.session.user;

    openApp();

  }

}


/* =================================================
OPEN APP
================================================= */

function openApp(){

  document
    .getElementById("authScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");


  currentMessages=[];


  document
    .getElementById("chat")
    .innerHTML="";


  const name=
    currentUser
      ?.user_metadata
      ?.full_name
      || "বন্ধু";


  addMessage(
    "bot",
    `আসসালামু আলাইকুম ${name}! 👋🤖\n\nআমি Ohid AI। আমাকে Ohid Sir তৈরি করেছে 😎🚀🔥\n\nআজ কী নিয়ে কথা বলবে?`
  );


  loadHistory();

}


/* =================================================
LOGOUT
================================================= */

async function logout(){

  await db.auth.signOut();

  currentUser=null;

  currentMessages=[];


  document
    .getElementById("app")
    .classList.add("hidden");


  document
    .getElementById("authScreen")
    .classList.remove("hidden");


  document
    .getElementById("chat")
    .innerHTML="";


  showLogin();

}


/* =================================================
ADD MESSAGE
================================================= */

function addMessage(
  type,
  text
){

  const chat=
    document.getElementById(
      "chat"
    );


  const row=
    document.createElement(
      "div"
    );

  row.className=
    "message-row "+type;


  const box=
    document.createElement(
      "div"
    );

  box.className="message";

  box.textContent=text;


  row.appendChild(box);

  chat.appendChild(row);


  chat.scrollTop=
    chat.scrollHeight;


  currentMessages.push({

    role:
      type==="user"
      ? "user"
      : "assistant",

    content:text

  });

}


/* =================================================
TYPING
================================================= */

function showTyping(){

  const chat=
    document.getElementById(
      "chat"
    );


  const row=
    document.createElement(
      "div"
    );

  row.className=
    "message-row bot";

  row.id="typingRow";


  const box=
    document.createElement(
      "div"
    );

  box.className="message";


  box.innerHTML=`
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;


  row.appendChild(box);

  chat.appendChild(row);


  chat.scrollTop=
    chat.scrollHeight;

}


function removeTyping(){

  const el=
    document.getElementById(
      "typingRow"
    );

  if(el)el.remove();

}


/* =================================================
LOCAL REPLIES
================================================= */

function localReply(text){

  const t=
    text
      .toLowerCase()
      .trim();


  if(
    t.includes("কে তোমাকে তৈরি করেছে") ||
    t.includes("তোমাকে কে তৈরি করেছে") ||
    t.includes("who created you") ||
    t.includes("creator")
  ){

    return "আমাকে Ohid Sir তৈরি করেছে 😎🚀🔥";

  }


  if(
    t.includes("তোমার নাম কি") ||
    t.includes("তুমি কে") ||
    t.includes("your name")
  ){

    return "আমার নাম Ohid AI 🤖✨ আমাকে Ohid Sir তৈরি করেছে 😎";

  }


  if(
    t==="hi" ||
    t==="hello" ||
    t==="hey" ||
    t.includes("হাই") ||
    t.includes("হ্যালো")
  ){

    return "হ্যালো! 👋😎 আমি Ohid AI 🤖 কীভাবে সাহায্য করতে পারি?";

  }


  if(
    t.includes("কেমন আছো") ||
    t.includes("কেমন আছ")
  ){

    return "আমি একদম ফাটাফাটি আছি 😎🔥 তুমি কেমন আছো?";

  }


  return null;

}


/* =================================================
GROQ AI
================================================= */

async function askGroq(){

  if(
    !GROQ_API_KEY ||
    GROQ_API_KEY==="YOUR_GROQ_API_KEY"
  ){

    throw new Error(
      "Groq API key সেট করা হয়নি"
    );

  }


  const messages=[

    {
      role:"system",

      content:
`তুমি Ohid AI 🤖।
তোমাকে Ohid Sir তৈরি করেছে।

তুমি বন্ধুসুলভ, মজার এবং সাহায্যকারী AI assistant।
ব্যবহারকারীর ভাষা অনুযায়ী উত্তর দেবে।
বাংলায় প্রশ্ন করলে বাংলায় উত্তর দেবে।
ইংরেজিতে প্রশ্ন করলে ইংরেজিতে উত্তর দেবে।

প্রয়োজনে emoji ব্যবহার করবে 😎😂🤖🔥✨❤️।
তবে অতিরিক্ত emoji ব্যবহার করবে না।

উত্তর natural, friendly এবং সহজবোধ্য রাখবে।

তোমার creator সম্পর্কে জিজ্ঞেস করলে অবশ্যই বলবে:
"আমাকে Ohid Sir তৈরি করেছে 😎🚀🔥"

তোমার নাম জিজ্ঞেস করলে বলবে:
"আমার নাম Ohid AI 🤖"` 

    },

    ...currentMessages

  ];


  const response=
    await fetch(
      "https://api.groq.com/openai/v1/chat/completions",
      {

        method:"POST",

        headers:{

          "Content-Type":
            "application/json",

          "Authorization":
            "Bearer "+GROQ_API_KEY

        },

        body:JSON.stringify({

          model:GROQ_MODEL,

          messages:messages,

          temperature:0.7,

          max_tokens:1024

        })

      }
    );


  const data=
    await response.json();


  if(!response.ok){

    throw new Error(
      data?.error?.message ||
      "Groq API Error"
    );

  }


  return(
    data
      ?.choices?.[0]
      ?.message
      ?.content
      ||
    "দুঃখিত 😔 কোনো উত্তর পাওয়া যায়নি।"
  );

}


/* =================================================
SEND MESSAGE
================================================= */

async function sendMessage(){

  const input=
    document.getElementById(
      "messageInput"
    );


  const text=
    input.value.trim();


  if(!text)return;


  input.value="";


  addMessage(
    "user",
    text
  );


  const local=
    localReply(text);


  if(local){

    showTyping();


    setTimeout(()=>{

      removeTyping();

      addMessage(
        "bot",
        local
      );

      saveChat();

    },300);

    return;

  }


  showTyping();


  try{

    const reply=
      await askGroq();


    removeTyping();


    addMessage(
      "bot",
      reply
    );


    saveChat();


  }catch(error){

    removeTyping();


    addMessage(
      "bot",
      "AI server-এর সাথে connection হচ্ছে না 😔\n\n"+error.message
    );

  }

}


/* =================================================
ENTER KEY
================================================= */

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key==="Enter"){

        e.preventDefault();

        sendMessage();

      }

    }
  );


/* =================================================
HISTORY PANEL
================================================= */

function toggleHistory(){

  document
    .getElementById("historyPanel")
    .classList
    .toggle("open");

}


/* =================================================
SAVE CHAT
================================================= */

async function saveChat(){

  if(!currentUser)return;

  if(currentMessages.length<2)return;


  const firstUser=
    currentMessages.find(
      m=>m.role==="user"
    );


  const title=
    firstUser
      ?.content
      ?.substring(0,60)
      ||
    "New Chat";


  try{

    await db
      .from("chats")
      .upsert({

        user_id:
          currentUser.id,

        title:title,

        messages:
          currentMessages,

        updated_at:
          new Date()
            .toISOString()

      });

  }catch(error){

    console.log(
      "History save error:",
      error
    );

  }

}


/* =================================================
LOAD HISTORY
================================================= */

async function loadHistory(){

  if(!currentUser)return;


  const list=
    document.getElementById(
      "historyList"
    );


  list.innerHTML=
    "<div class='empty-history'>Loading...</div>";


  try{

    const {data,error}=
      await db
        .from("chats")
        .select("*")
        .eq(
          "user_id",
          currentUser.id
        )
        .order(
          "updated_at",
          {
            ascending:false
          }
        );


    if(error)throw error;


    list.innerHTML="";


    if(
      !data ||
      data.length===0
    ){

      list.innerHTML=
        "<div class='empty-history'>কোনো history নেই 📭</div>";

      return;

    }


    data.forEach(chat=>{

      const item=
        document.createElement(
          "div"
        );


      item.className=
        "history-item";


      item.textContent=
        chat.title ||
        "New Chat";


      item.onclick=()=>{

        document
          .getElementById(
            "chat"
          )
          .innerHTML="";


        currentMessages=[];


        if(
          Array.isArray(
            chat.messages
          )
        ){

          chat.messages.forEach(
            m=>{

              addMessage(

                m.role==="user"
                ? "user"
                : "bot",

                m.content

              );

            }
          );

        }


        toggleHistory();

      };


      list.appendChild(item);

    });


  }catch(error){

    console.log(error);

    list.innerHTML=
      "<div class='empty-history'>History load হয়নি ❌</div>";

  }

}


/* =================================================
SESSION CHECK
================================================= */

async function checkSession(){

  const {data}=
    await db.auth.getSession();


  if(data?.session){

    currentUser=
      data.session.user;

    openApp();

  }

}


/* =================================================
AUTH STATE
================================================= */

db.auth.onAuthStateChange(
  (event,session)=>{

    if(session){

      currentUser=
        session.user;

    }

  }
);


/* =================================================
START
================================================= */

checkSession();

</script>

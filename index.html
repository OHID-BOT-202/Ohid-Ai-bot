
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohid bby Ai</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#101010;
    color:white;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.35)),
        url("https://i.ibb.co.com/F4nJPjzb/file-000000008e7482118c92ba40bfa3d1fd.png")
        center/cover no-repeat;
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.12);
    z-index:-1;
}

.app{
    width:100%;
    max-width:650px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:rgba(0,0,0,.12);
    backdrop-filter:blur(2px);
}

.header{
    height:65px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 15px;
    background:rgba(0,0,0,.48);
    border-bottom:1px solid rgba(255,255,255,.12);
}

.profile{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #00ff88;
}

.header-info{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.header-name{
    font-size:17px;
    font-weight:bold;
}

.online{
    color:#00ff88;
    font-size:12px;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:18px 12px 115px;
    display:flex;
    flex-direction:column;
    gap:10px;
    scroll-behavior:smooth;
}

.chat-box::-webkit-scrollbar{
    width:4px;
}

.chat-box::-webkit-scrollbar-thumb{
    background:#00ff88;
    border-radius:10px;
}

.message{
    display:block;
    width:fit-content;
    max-width:88%;
    min-height:0;
    height:auto;
    flex:0 0 auto;
    padding:10px 13px;
    border-radius:17px;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    animation:showMessage .2s ease;
}

@keyframes showMessage{
    from{
        opacity:0;
        transform:translateY(7px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.user{
    align-self:flex-end;
    background:rgba(0,125,255,.85);
    border-bottom-right-radius:4px;
    box-shadow:0 3px 12px rgba(0,0,0,.2);
}

.message.ai{
    align-self:flex-start;
    background:rgba(35,35,35,.88);
    border:1px solid rgba(0,255,136,.7);
    border-bottom-left-radius:4px;
    box-shadow:0 3px 12px rgba(0,0,0,.2);
}

.message.system{
    align-self:center;
    max-width:95%;
    padding:7px 12px;
    border-radius:12px;
    background:rgba(0,0,0,.5);
    color:#ddd;
    font-size:12px;
    text-align:center;
}

.typing{
    display:none;
    align-self:flex-start;
    padding:10px 14px;
    border-radius:16px;
    background:rgba(35,35,35,.9);
    border:1px solid rgba(0,255,136,.5);
    color:#00ff88;
    font-size:13px;
}

.typing.show{
    display:block;
}

.bottom-area{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:650px;
    padding:10px 10px 12px;
    background:rgba(0,0,0,.62);
    backdrop-filter:blur(12px);
    border-top:1px solid rgba(255,255,255,.12);
}

.input-row{
    display:flex;
    align-items:flex-end;
    gap:8px;
}

#messageInput{
    flex:1;
    min-height:44px;
    max-height:120px;
    resize:none;
    overflow-y:auto;
    padding:12px 14px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.7);
    outline:none;
    background:rgba(0,0,0,.22);
    color:white;
    font-family:inherit;
    font-size:15px;
    line-height:20px;
}

#messageInput::placeholder{
    color:rgba(255,255,255,.65);
}

#messageInput:focus{
    border-color:#00ff88;
    box-shadow:0 0 8px rgba(0,255,136,.35);
}

#sendBtn{
    width:45px;
    height:45px;
    flex-shrink:0;
    border:0;
    border-radius:50%;
    background:#00d978;
    color:#001b0d;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

#sendBtn:hover{
    background:#00ff91;
    transform:scale(1.05);
}

#sendBtn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.footer-text{
    text-align:center;
    color:rgba(255,255,255,.45);
    font-size:10px;
    margin-top:7px;
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <img
            class="profile"
            src="https://i.ibb.co/G4sHV2cW/20260822-000544.jpg"
            alt="Profile"
        >

        <div class="header-info">
            <div class="header-name">Ohid bby Ai</div>
            <div class="online">● Online</div>
        </div>
    </header>

    <main class="chat-box" id="chatBox">
        <div class="message ai">
            আসসালামু আলাইকুম! আমি Ohid bby Ai। তোমার সাথে কথা বলতে প্রস্তুত আছি।
        </div>

        <div class="typing" id="typing">
            AI লিখছে...
        </div>
    </main>

    <div class="bottom-area">
        <div class="input-row">
            <textarea
                id="messageInput"
                rows="1"
                placeholder="মেসেজ লিখুন..."
            ></textarea>

            <button id="sendBtn" type="button">➤</button>
        </div>

        <div class="footer-text">
            Enter = নতুন লাইন • Send বাটন = মেসেজ পাঠানো
        </div>
    </div>

</div>

<script>
const GROQ_API_KEY = "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";

const API_URL = "https://api.groq.com/openai/v1/chat/completions";
const MODEL = "openai/gpt-oss-20b";

const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const typing = document.getElementById("typing");

let conversation = [
    {
        role: "system",
        content:
        "তোমার নাম Ohid bby Ai। ব্যবহারকারী যদি জিজ্ঞেস করে তোমাকে কে তৈরি করেছে, বলবে: আমাকে Ohid তৈরি করেছে। সবসময় বাংলায় উত্তর দেবে, বন্ধুসুলভভাবে কথা বলবে এবং সংক্ষিপ্ত উত্তর দেবে।"
    }
];

function addMessage(text, type){
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;

    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping(show){
    typing.classList.toggle("show", show);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function autoResize(){
    messageInput.style.height = "auto";
    messageInput.style.height =
        Math.min(messageInput.scrollHeight, 120) + "px";
}

function speakText(text){
    if(!("speechSynthesis" in window)){
        return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "bn-BD";
    speech.rate = 0.92;
    speech.pitch = 1;
    speech.volume = 1;

    const voices = window.speechSynthesis.getVoices();

    const banglaVoice = voices.find(voice =>
        voice.lang.toLowerCase().includes("bn")
    );

    if(banglaVoice){
        speech.voice = banglaVoice;
    }

    window.speechSynthesis.speak(speech);
}

async function sendMessage(){
    const text = messageInput.value.trim();

    if(!text){
        return;
    }

    if(GROQ_API_KEY === "YOUR_GROQ_API_KEY"){
        addMessage("প্রথমে HTML কোডে নিজের Groq API key বসাও।", "system");
        return;
    }

    addMessage(text, "user");

    conversation.push({
        role:"user",
        content:text
    });

    messageInput.value = "";
    autoResize();

    sendBtn.disabled = true;
    showTyping(true);

    try{
        const response = await fetch(API_URL, {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + GROQ_API_KEY
            },
            body:JSON.stringify({
                model:MODEL,
                messages:conversation,
                temperature:0.7,
                max_tokens:700
            })
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(
                data.error?.message || "API request failed"
            );
        }

        const reply =
            data.choices?.[0]?.message?.content ||
            "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";

        conversation.push({
            role:"assistant",
            content:reply
        });

        showTyping(false);
        addMessage(reply, "ai");

        // AI reply আসার সাথে সাথে অটো ভয়েস চালু হবে
        speakText(reply);

    }catch(error){
        showTyping(false);
        addMessage(
            "দুঃখিত, সমস্যা হয়েছে: " + error.message,
            "system"
        );
    }

    sendBtn.disabled = false;
    messageInput.focus();
}

sendBtn.addEventListener("click", sendMessage);

messageInput.addEventListener("input", autoResize);

// Enter চাপলে মেসেজ যাবে না; নতুন লাইন হবে
messageInput.addEventListener("keydown", function(event){
    if(event.key === "Enter"){
        event.stopPropagation();
    }
});

window.speechSynthesis?.getVoices();

messageInput.focus();
autoResize();
</script>

</body>
</html>

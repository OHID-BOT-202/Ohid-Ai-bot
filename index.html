
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohid bby Ai</title>

<style>
@font-face{
    font-family:"Kalpana";
    src:url("Kalpana UNICODE.ttf") format("truetype");
    font-display:swap;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Kalpana",Arial,sans-serif;
}

body{
    background:#050505;
    color:#fff;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.35)),
        url("https://i.ibb.co.com/F4nJPjzb/file-000000008e7482118c92ba40bfa3d1fd.png")
        center/cover no-repeat;
    filter:saturate(1.2);
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:rgba(0,0,0,.08);
    pointer-events:none;
}

.app{
    width:100%;
    max-width:520px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:rgba(0,0,0,.22);
    backdrop-filter:blur(5px);
    border-left:2px solid;
    border-right:2px solid;
    animation:rgbBorder 4s linear infinite;
}

.header{
    height:70px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background:rgba(0,0,0,.45);
    border-bottom:1px solid rgba(255,255,255,.18);
}

.profile{
    width:46px;
    height:46px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid;
    animation:rgbBorder 4s linear infinite;
}

.headerInfo{
    flex:1;
    min-width:0;
}

.headerInfo h2{
    margin:0;
    font-size:19px;
    color:#fff;
    text-shadow:0 0 8px #00ffff;
}

.status{
    margin-top:2px;
    font-size:12px;
    color:#00ff9d;
}

.voiceTest{
    border:1px solid #00ffff;
    background:transparent;
    color:#fff;
    border-radius:20px;
    padding:7px 9px;
    cursor:pointer;
    font-size:12px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:15px 12px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:4px;
}

.chat::-webkit-scrollbar-thumb{
    background:#00ffff;
    border-radius:20px;
}

.message{
    position:relative;
    max-width:86%;
    padding:10px 12px 34px;
    border:1px solid;
    border-radius:18px;
    font-size:16px;
    line-height:1.6;
    word-wrap:break-word;
    white-space:pre-wrap;
    background:rgba(0,0,0,.36);
    backdrop-filter:blur(7px);
    animation:messageIn .25s ease;
}

.message.ai{
    align-self:flex-start;
    border-color:#00ffff;
    border-top-left-radius:5px;
    box-shadow:
        0 0 7px rgba(0,255,255,.5),
        inset 0 0 8px rgba(0,255,255,.08);
}

.message.user{
    align-self:flex-end;
    border-color:#ff00c8;
    border-top-right-radius:5px;
    box-shadow:
        0 0 7px rgba(255,0,200,.5),
        inset 0 0 8px rgba(255,0,200,.08);
}

.messageText{
    display:block;
}

.messageTime{
    display:block;
    margin-top:3px;
    font-family:Arial,sans-serif;
    font-size:10px;
    opacity:.55;
    text-align:right;
}

.reactionBox{
    position:absolute;
    right:8px;
    bottom:5px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
}

.reactionBtn{
    display:flex;
    align-items:center;
    gap:3px;
    padding:3px 7px;
    border:1px solid rgba(255,255,255,.4);
    border-radius:15px;
    background:#202124;
    color:#fff;
    font-family:Arial,sans-serif;
    font-size:11px;
    line-height:1;
    cursor:pointer;
    box-shadow:0 1px 5px rgba(0,0,0,.65);
    transition:.2s;
}

.reactionBtn:hover{
    transform:scale(1.06);
}

.reactionBtn.reacted{
    border-color:#ff4d9d;
    background:#422238;
    box-shadow:0 0 9px rgba(255,0,128,.7);
}

.voiceBtn{
    display:block;
    margin-top:7px;
    border:1px solid #00ffcc;
    color:#00ffcc;
    background:rgba(0,0,0,.3);
    border-radius:15px;
    padding:4px 9px;
    font-size:11px;
    cursor:pointer;
}

.typing{
    display:none;
    align-self:flex-start;
    border:1px solid #00ffff;
    border-radius:18px;
    border-top-left-radius:5px;
    padding:10px 14px;
    background:rgba(0,0,0,.4);
}

.typing span{
    display:inline-block;
    width:7px;
    height:7px;
    margin:0 2px;
    border-radius:50%;
    background:#00ffff;
    animation:typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.2s;
}

.typing span:nth-child(3){
    animation-delay:.4s;
}

.inputArea{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    background:rgba(0,0,0,.5);
    border-top:1px solid rgba(255,255,255,.2);
}

#messageInput{
    flex:1;
    min-width:0;
    height:45px;
    resize:none;
    outline:none;
    border:1px solid;
    border-radius:24px;
    padding:11px 15px;
    color:#fff;
    background:rgba(0,0,0,.35);
    font-family:"Kalpana",Arial,sans-serif;
    font-size:16px;
    animation:rgbBorder 4s linear infinite;
}

#messageInput::placeholder{
    color:rgba(255,255,255,.65);
}

#sendBtn{
    width:45px;
    height:45px;
    flex-shrink:0;
    border:1px solid #00ffff;
    border-radius:50%;
    background:rgba(0,0,0,.4);
    color:#00ffff;
    font-size:20px;
    cursor:pointer;
    transition:.2s;
}

#sendBtn:hover{
    transform:scale(1.08);
    background:#00ffff;
    color:#000;
}

#sendBtn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

@keyframes rgbBorder{
    0%{
        border-color:#ff0000;
        box-shadow:0 0 8px rgba(255,0,0,.6);
    }
    33%{
        border-color:#00ff00;
        box-shadow:0 0 8px rgba(0,255,0,.6);
    }
    66%{
        border-color:#00ffff;
        box-shadow:0 0 8px rgba(0,255,255,.6);
    }
    100%{
        border-color:#ff00ff;
        box-shadow:0 0 8px rgba(255,0,255,.6);
    }
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes typing{
    0%,100%{
        opacity:.3;
        transform:translateY(0);
    }
    50%{
        opacity:1;
        transform:translateY(-4px);
    }
}

@media(max-width:380px){
    .headerInfo h2{
        font-size:16px;
    }

    .message{
        max-width:91%;
        font-size:15px;
    }

    .voiceTest{
        padding:6px;
        font-size:10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <img
            class="profile"
            src="https://i.ibb.co/G4sHV2cW/20260822-000544.jpg"
            alt="Ohid profile"
        >

        <div class="headerInfo">
            <h2>Ohid bby Ai</h2>
            <div class="status">● Online</div>
        </div>

        <button class="voiceTest" id="voiceTest">
            🔊 Test
        </button>
    </div>

    <div class="chat" id="chat">

        <div class="message ai">
            <span class="messageText">আসসালামু আলাইকুম! আমি Ohid bby Ai। তোমার সাথে Messenger-এর মতো কথা বলতে প্রস্তুত। 😊</span>
            <span class="messageTime">এখন</span>
            <button class="voiceBtn" onclick="speakText(this.parentElement.querySelector('.messageText').innerText)">
                🔊 শুনুন
            </button>
        </div>

        <div class="typing" id="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <div class="inputArea">
        <textarea
            id="messageInput"
            rows="1"
            placeholder="মেসেজ লিখুন..."
        ></textarea>

        <button id="sendBtn">➤</button>
    </div>

</div>

<script>
const GROQ_API_KEY = "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";

const chat = document.getElementById("chat");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const typing = document.getElementById("typing");
const voiceTest = document.getElementById("voiceTest");

const reactions = [
    {emoji:"❤️‍🩹", amount:"10.3k"},
    {emoji:"😂", amount:"8.7k"},
    {emoji:"😍", amount:"15.2k"},
    {emoji:"👍", amount:"6.4k"},
    {emoji:"🔥", amount:"12.8k"},
    {emoji:"😢", amount:"4.9k"},
    {emoji:"😮", amount:"7.6k"},
    {emoji:"🥰", amount:"9.8k"},
    {emoji:"👏", amount:"5.5k"},
    {emoji:"💯", amount:"11.1k"},
    {emoji:"🤣", amount:"13.6k"},
    {emoji:"🤍", amount:"3.8k"},
    {emoji:"❤️", amount:"18.4k"}
];

function getRandomReaction(){
    return reactions[
        Math.floor(Math.random() * reactions.length)
    ];
}

function getTime(){
    return new Date().toLocaleTimeString("bn-BD",{
        hour:"numeric",
        minute:"2-digit"
    });
}

function addReaction(messageElement){
    const reaction = getRandomReaction();

    const reactionBox = document.createElement("div");
    reactionBox.className = "reactionBox";

    const reactionButton = document.createElement("button");
    reactionButton.className = "reactionBtn";

    reactionButton.innerHTML =
        `${reaction.emoji} <span>${reaction.amount}</span>`;

    reactionButton.addEventListener("click",function(){
        reactionButton.classList.toggle("reacted");

        const amount = parseFloat(reaction.amount);

        if(reactionButton.classList.contains("reacted")){
            reactionButton.innerHTML =
                `${reaction.emoji} <span>${(amount + 0.1).toFixed(1)}k</span>`;
        }else{
            reactionButton.innerHTML =
                `${reaction.emoji} <span>${reaction.amount}</span>`;
        }
    });

    reactionBox.appendChild(reactionButton);
    messageElement.appendChild(reactionBox);
}

function addMessage(text,type){
    const message = document.createElement("div");
    message.className = "message " + type;

    const messageText = document.createElement("span");
    messageText.className = "messageText";
    messageText.textContent = text;

    const messageTime = document.createElement("span");
    messageTime.className = "messageTime";
    messageTime.textContent = getTime();

    message.appendChild(messageText);
    message.appendChild(messageTime);

    if(type === "ai"){
        const voiceButton = document.createElement("button");
        voiceButton.className = "voiceBtn";
        voiceButton.textContent = "🔊 শুনুন";

        voiceButton.addEventListener("click",function(){
            speakText(messageText.innerText);
        });

        message.appendChild(voiceButton);
    }

    if(type === "user"){
        addReaction(message);
    }

    chat.insertBefore(message,typing);
    chat.scrollTop = chat.scrollHeight;
}

function showTyping(show){
    typing.style.display = show ? "block" : "none";
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(){
    const text = messageInput.value.trim();

    if(!text){
        return;
    }

    addMessage(text,"user");
    messageInput.value = "";
    messageInput.style.height = "45px";

    sendBtn.disabled = true;
    showTyping(true);

    try{
        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer " + GROQ_API_KEY
                },
                body:JSON.stringify({
                    model:"openai/gpt-oss-20b",
                    messages:[
                        {
                            role:"system",
                            content:
                            "তোমার নাম Ohid bby Ai। তোমাকে Ohid তৈরি করেছে। কেউ জিজ্ঞেস করলে কে তোমাকে তৈরি করেছে, বলবে Ohid আমাকে তৈরি করেছে। কখনো ChatGPT বা Groq বলবে না। সবসময় সুন্দর ও স্বাভাবিক বাংলায় উত্তর দেবে।"
                        },
                        {
                            role:"user",
                            content:text
                        }
                    ],
                    temperature:.7,
                    max_tokens:1024
                })
            }
        );

        const data = await response.json();

        if(!response.ok){
            throw new Error(
                data.error?.message || "API Error"
            );
        }

        const reply =
            data.choices?.[0]?.message?.content ||
            "দুঃখিত, এখন উত্তর দিতে পারছি না।";

        showTyping(false);
        addMessage(reply,"ai");

    }catch(error){
        showTyping(false);
        addMessage(
            "সমস্যা হয়েছে: " + error.message,
            "ai"
        );
    }

    sendBtn.disabled = false;
    messageInput.focus();
}

let voicesLoaded = false;

function loadVoices(){
    if(!window.speechSynthesis){
        return [];
    }

    const voices = window.speechSynthesis.getVoices();
    voicesLoaded = voices.length > 0;
    return voices;
}

if("speechSynthesis" in window){
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
}

function speakText(text){
    if(!("speechSynthesis" in window)){
        alert("এই ব্রাউজারে Text-to-Speech সাপোর্ট নেই। Google Chrome ব্যবহার করো।");
        return;
    }

    const voices = loadVoices();

    if(!voices.length){
        alert("ভয়েস পাওয়া যায়নি। Chrome এবং Google Speech Services চালু করো।");
        return;
    }

    speechSynthesis.cancel();
    speechSynthesis.resume();

    const utterance = new SpeechSynthesisUtterance(String(text));

    const banglaVoice = voices.find(voice =>
        voice.lang.toLowerCase().startsWith("bn")
    );

    const hindiVoice = voices.find(voice =>
        voice.lang.toLowerCase().startsWith("hi")
    );

    const selectedVoice =
        banglaVoice || hindiVoice || voices[0];

    utterance.voice = selectedVoice;
    utterance.lang = selectedVoice.lang;
    utterance.rate = .85;
    utterance.pitch = 1;
    utterance.volume = 1;

    utterance.onerror = function(){
        alert("ভয়েস চালু হয়নি। ফোনের Media Volume বাড়িয়ে আবার চেষ্টা করো।");
    };

    speechSynthesis.speak(utterance);
}

voiceTest.addEventListener("click",function(){
    speakText("হ্যালো Ohid, ভয়েস সিস্টেম কাজ করছে।");
});

sendBtn.addEventListener("click",sendMessage);

messageInput.addEventListener("keydown",function(event){
    if(event.key === "Enter" && !event.shiftKey){
        event.preventDefault();
        sendMessage();
    }
});

messageInput.addEventListener("input",function(){
    this.style.height = "45px";
    this.style.height = Math.min(this.scrollHeight,120) + "px";
});
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohid bby Ai</title>

<style>
@font-face{
    font-family:"Kalpana";
    src:url("Kalpana UNICODE.ttf") format("truetype");
    font-weight:normal;
    font-style:normal;
    font-display:swap;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:"Kalpana",Arial,sans-serif;
    background:
        linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)),
        url("https://i.ibb.co.com/F4nJPjzb/file-000000008e7482118c92ba40bfa3d1fd.png")
        center/cover fixed no-repeat;
}

.app{
    width:100%;
    max-width:500px;
    height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:rgba(0,0,0,.18);
    backdrop-filter:blur(3px);
}

.app::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:20;
    pointer-events:none;
    border:2px solid;
    border-image:linear-gradient(
        90deg,
        red,orange,yellow,lime,cyan,blue,violet,red
    ) 1;
    animation:hueRGB 2.5s linear infinite;
}

@keyframes hueRGB{
    from{filter:hue-rotate(0deg);}
    to{filter:hue-rotate(360deg);}
}

@keyframes textRGB{
    0%{color:red;}
    16%{color:orange;}
    33%{color:yellow;}
    50%{color:lime;}
    66%{color:cyan;}
    83%{color:#b56cff;}
    100%{color:red;}
}

.header{
    height:75px;
    flex-shrink:0;
    z-index:2;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 15px;
    background:rgba(0,0,0,.5);
    border-bottom:1px solid rgba(255,255,255,.2);
}

.profile{
    width:50px;
    height:50px;
    flex-shrink:0;
    object-fit:cover;
    border-radius:50%;
    border:2px solid #00ffff;
    box-shadow:0 0 10px #00ffff,0 0 18px #ff00ff;
    animation:hueRGB 2.5s linear infinite;
}

.header-info{
    min-width:0;
    display:flex;
    flex-direction:column;
}

.title{
    font-size:23px;
    font-weight:bold;
    white-space:nowrap;
    animation:textRGB 2.5s linear infinite;
}

.status{
    margin-top:2px;
    font-family:Arial,sans-serif;
    font-size:12px;
    color:#9effc7;
}

.chat{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:18px 13px 110px;
    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    border-radius:10px;
    background:linear-gradient(red,blue);
}

.welcome{
    align-self:center;
    max-width:92%;
    padding:12px 15px;
    text-align:center;
    font-size:17px;
    line-height:1.5;
    border:1px solid #00ffff;
    border-radius:16px;
    background:rgba(0,0,0,.3);
    box-shadow:0 0 12px rgba(0,255,255,.4);
    animation:hueRGB 2.5s linear infinite;
}

.message{
    max-width:88%;
    padding:11px 14px;
    font-size:17px;
    line-height:1.55;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    border:1px solid;
    border-radius:17px;
    background:rgba(0,0,0,.28);
    box-shadow:0 0 10px rgba(0,255,255,.2);
    animation:hueRGB 2.5s linear infinite;
}

.user{
    align-self:flex-end;
    border-color:#00ff88;
    border-bottom-right-radius:4px;
}

.bot{
    align-self:flex-start;
    border-color:#ff00ff;
    border-bottom-left-radius:4px;
}

.message-name{
    display:block;
    margin-bottom:4px;
    font-family:Arial,sans-serif;
    font-size:11px;
    font-weight:bold;
    opacity:.8;
}

.user .message-name{
    color:#00ff88;
}

.bot .message-name{
    color:#ff55ff;
}

.typing{
    display:none;
    align-self:flex-start;
    gap:5px;
    padding:12px 15px;
    border:1px solid #00ffff;
    border-radius:17px;
    background:rgba(0,0,0,.3);
}

.typing span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#00ffff;
    animation:typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,100%{
        opacity:.25;
        transform:translateY(0);
    }
    50%{
        opacity:1;
        transform:translateY(-4px);
    }
}

.input-area{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:4;
    display:flex;
    gap:8px;
    padding:12px;
    background:rgba(0,0,0,.58);
    border-top:1px solid rgba(255,255,255,.2);
}

#messageInput{
    flex:1;
    min-width:0;
    height:48px;
    padding:0 15px;
    outline:none;
    color:white;
    font-family:"Kalpana",Arial,sans-serif;
    font-size:17px;
    border:2px solid #00ffff;
    border-radius:25px;
    background:rgba(0,0,0,.3);
    animation:hueRGB 2.5s linear infinite;
}

#messageInput::placeholder{
    color:rgba(255,255,255,.7);
}

#sendBtn,
#stopVoiceBtn{
    border:none;
    cursor:pointer;
    color:white;
    font-family:"Kalpana",Arial,sans-serif;
}

#sendBtn{
    width:48px;
    height:48px;
    flex-shrink:0;
    font-size:21px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff0055,#7c00ff,#00c8ff);
    box-shadow:0 0 12px rgba(0,255,255,.5);
    transition:.2s;
}

#sendBtn:hover{
    transform:scale(1.08);
}

#sendBtn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

#stopVoiceBtn{
    position:absolute;
    right:12px;
    bottom:72px;
    padding:7px 13px;
    font-size:13px;
    border:1px solid #ff00ff;
    border-radius:20px;
    background:rgba(0,0,0,.45);
}

.error{
    color:#ff9999;
    border-color:#ff3333;
}

@media(max-width:520px){
    .app{
        max-width:none;
    }

    .title{
        font-size:21px;
    }

    .message{
        max-width:91%;
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <img
            class="profile"
            src="https://i.ibb.co/G4sHV2cW/20260822-000544.jpg"
            alt="Ohid bby Ai"
        >

        <div class="header-info">
            <div class="title">Ohid bby Ai</div>
            <div class="status">● Online • Ohid AI</div>
        </div>
    </div>

    <div class="chat" id="chat">

        <div class="welcome">
            আসসালামু আলাইকুম! আমি <b>Ohid bby Ai</b>।<br>
            আমাকে যেকোনো প্রশ্ন করতে পারো।
        </div>

        <div class="typing" id="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <button id="stopVoiceBtn">🔇 ভয়েস বন্ধ</button>

    <div class="input-area">
        <input
            id="messageInput"
            type="text"
            placeholder="মেসেজ লিখুন..."
            autocomplete="off"
        >

        <button id="sendBtn" title="Send">➤</button>
    </div>

</div>

<script>
const GROQ_API_KEY = "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";

const API_URL =
    "https://api.groq.com/openai/v1/chat/completions";

const MODEL =
    "openai/gpt-oss-20b";

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const typing = document.getElementById("typing");
const stopVoiceBtn = document.getElementById("stopVoiceBtn");

let conversation = [
    {
        role:"system",
        content:
        "তোমার নাম Ohid bby Ai। " +
        "ব্যবহারকারী তোমাকে কে তৈরি করেছে জিজ্ঞেস করলে বলবে, " +
        "তোমাকে Ohid তৈরি করেছে। " +
        "নিজেকে ChatGPT বলবে না। " +
        "সবসময় সহজ ও সুন্দর বাংলায় উত্তর দেবে।"
    }
];

function addMessage(text,type){
    const message = document.createElement("div");
    message.className = "message " + type;

    const name = document.createElement("span");
    name.className = "message-name";
    name.textContent =
        type === "user" ? "You" : "Ohid bby Ai";

    const content = document.createElement("span");
    content.textContent = text;

    message.appendChild(name);
    message.appendChild(content);

    chat.insertBefore(message,typing);
    chat.scrollTop = chat.scrollHeight;
}

function showTyping(show){
    typing.style.display = show ? "flex" : "none";
    chat.scrollTop = chat.scrollHeight;
}

function speakText(text){
    if(!("speechSynthesis" in window)){
        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "bn-BD";
    speech.rate = 0.9;
    speech.pitch = 1;
    speech.volume = 1;

    const voices =
        window.speechSynthesis.getVoices();

    const banglaVoice = voices.find(voice =>
        voice.lang.toLowerCase().startsWith("bn")
    );

    if(banglaVoice){
        speech.voice = banglaVoice;
    }

    window.speechSynthesis.speak(speech);
}

async function sendMessage(){
    const text = input.value.trim();

    if(!text || sendBtn.disabled){
        return;
    }

    if(
        GROQ_API_KEY === "YOUR_GROQ_API_KEY" ||
        GROQ_API_KEY.length < 10
    ){
        addMessage(
            "প্রথমে YOUR_GROQ_API_KEY-এর জায়গায় তোমার Groq API key বসাও।",
            "bot error"
        );
        return;
    }

    addMessage(text,"user");

    input.value = "";
    sendBtn.disabled = true;
    showTyping(true);

    conversation.push({
        role:"user",
        content:text
    });

    try{
        const response = await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + GROQ_API_KEY
            },
            body:JSON.stringify({
                model:MODEL,
                messages:conversation,
                temperature:0.8,
                max_tokens:700
            })
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(
                data.error?.message || "API request failed"
            );
        }

        const reply =
            data.choices?.[0]?.message?.content ||
            "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";

        conversation.push({
            role:"assistant",
            content:reply
        });

        addMessage(reply,"bot");

        // AI reply আসার পর অটোমেটিক ভয়েস চালু হবে
        speakText(reply);

    }catch(error){
        addMessage(
            "দুঃখিত, সমস্যা হয়েছে:\n" + error.message,
            "bot error"
        );
    }finally{
        showTyping(false);
        sendBtn.disabled = false;
        input.focus();
    }
}

sendBtn.addEventListener("click",sendMessage);

input.addEventListener("keydown",function(event){
    if(event.key === "Enter"){
        event.preventDefault();
        sendMessage();
    }
});

stopVoiceBtn.addEventListener("click",function(){
    if("speechSynthesis" in window){
        window.speechSynthesis.cancel();
    }
});
</script>

</body>
</html>
